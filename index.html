<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUTA Play - Validación de Token</title>
    <style>
        body { 
            background: #0f172a; 
            color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: #1e293b; 
            padding: 2rem; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
            width: 340px; 
            text-align: center; 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 12px 0; 
            border: 1px solid #334155; 
            border-radius: 6px; 
            background: #0f172a; 
            color: white; 
            box-sizing: border-box; 
            font-size: 14px;
        }
        input:focus { outline: none; border-color: #6366f1; }
        button { 
            background: #6366f1; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover { background: #4f46e5; }
        #error-msg { 
            color: #ef4444; 
            font-size: 13px; 
            margin-top: 8px; 
            min-height: 18px; 
            font-weight: 500;
        }
        .hidden { display: none !important; }
        #app-content { width: 100%; }
        #result { margin-top: 15px; text-align: left; }
        img { width: 100%; border-radius: 6px; }
        audio { width: 100%; margin-top: 10px; }
        .logout-btn { background: #334155; margin-top: 15px; font-size: 12px; padding: 6px; }
        .logout-btn:hover { background: #475569; }
    </style>
</head>
<body>

    <!-- PANTALLA DE INGRESO DE TOKEN -->
    <div id="auth-screen" class="card">
        <h2>Ingresar token</h2>
        <p style="font-size: 13px; color: #94a3b8; margin-bottom: 15px;">
            Introduce tu token autorizado para poder vincularte.
        </p>
        <input type="text" id="token-input" placeholder="Escribe tu token aquí...">
        <button onclick="validarToken()">Vincular</button>
        <div id="error-msg"></div>
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <div id="app-screen" class="card hidden">
        <div id="app-content">
            <h2>🎵 Yuta Play</h2>
            <p style="color: #22c55e; font-size: 12px; margin-bottom: 10px;">🟢 Vinculado correctamente</p>
            <input type="text" id="query" placeholder="Escribe el nombre o link...">
            <button onclick="buscar()">Buscar / Escuchar</button>
            <div id="result"></div>
            <button class="logout-btn" onclick="cerrarSesion()">Cerrar sesión</button>
        </div>
    </div>

    <script>
        const API_URL = "";
        const TOKENS_VALIDOS = [
            "MIAKHALIFAPRIME", "Jonathan2026", "Jon67y89", "año2027",
            "botpremium27", "chambeador247", "abeduldecacao24", 
            "bondiolasigma67", "Yutaplay", "Mipansususu67"
        ];

        window.addEventListener('DOMContentLoaded', () => {
            const tokenGuardado = localStorage.getItem('yuta_token_auth');
            if (tokenGuardado && TOKENS_VALIDOS.includes(tokenGuardado)) {
                mostrarApp();
            }
        });

        function validarToken() {
            const inputVal = document.getElementById('token-input').value.trim();
            const errorDiv = document.getElementById('error-msg');

            if (TOKENS_VALIDOS.includes(inputVal)) {
                localStorage.setItem('yuta_token_auth', inputVal);
                errorDiv.textContent = "";
                mostrarApp();
            } else {
                errorDiv.textContent = "token No registrado";
                document.getElementById('token-input').style.borderColor = "#ef4444";
            }
        }

        function mostrarApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
        }

        function cerrarSesion() {
            localStorage.removeItem('yuta_token_auth');
            document.getElementById('token-input').value = "";
            document.getElementById('error-msg').textContent = "";
            document.getElementById('token-input').style.borderColor = "#334155";
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
        }

        async function buscar() {
            const q = document.getElementById('query').value;
            const resDiv = document.getElementById('result');
            if (!q) return alert("Escribe algo para buscar");

            resDiv.innerHTML = "⏳ Buscando...";
            try {
                const response = await fetch(`${API_URL}/api/search?q=${encodeURIComponent(q)}`);
                const data = await response.json();
                if (data.error) {
                    resDiv.innerHTML = `<p style="color:#ef4444; font-size:13px;">${data.error}</p>`;
                    return;
                }
                resDiv.innerHTML = `
                    <img src="${data.thumbnail}" alt="Miniatura">
                    <p style="font-size:14px; margin: 8px 0;"><b>${data.title}</b></p>
                    <p style="font-size: 12px; color: #94a3b8; margin-bottom: 8px;">Canal: ${data.author} | Duración: ${data.duration}</p>
                    <audio controls src="${API_URL}/api/audio?q=${encodeURIComponent(q)}"></audio>
                `;
            } catch (e) {
                resDiv.innerHTML = `<p style="color:#ef4444; font-size:13px;">Error al conectar con la API.</p>`;
            }
        }
    </script>
</body>
</html>
